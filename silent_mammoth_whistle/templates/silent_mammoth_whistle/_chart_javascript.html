<script>
	// Colors
	const authed_active = '#724bb7' // --purple-500
	const authed_hover = '#8662C7' // --purple-400
	const authed_inactive = '#CFBCF2' // --purple-200
	const unauthed_active = '#829AB1' // --blue-gray-500
	const unauthed_hover = '#9fb3c8' // --blue-gray-400
	const unauthed_inactive = '#D9E2EC' //--blue-gray-200

	// 1 for each day of the month that had at least one 4xx or 5xx response. Bars for those days are drawn with a striped pattern.
	const errorDays = {{ chart_error_flags }}

	// Returns a diagonally striped CanvasPattern tinted with the given base color. Patterns are cached per color.
	const stripedPatterns = {}
	function stripedPattern(baseColor) {
		if (stripedPatterns[baseColor]) {
			return stripedPatterns[baseColor]
		}
		const size = 8
		const tile = document.createElement('canvas')
		tile.width = size
		tile.height = size
		const tileCtx = tile.getContext('2d')
		tileCtx.fillStyle = baseColor
		tileCtx.fillRect(0, 0, size, size)
		tileCtx.strokeStyle = 'rgba(0, 0, 0, 0.25)'
		tileCtx.lineWidth = 2
		tileCtx.beginPath()
		// Three parallel diagonal lines so the tile repeats seamlessly
		tileCtx.moveTo(-size / 2, size / 2); tileCtx.lineTo(size / 2, -size / 2)
		tileCtx.moveTo(0, size); tileCtx.lineTo(size, 0)
		tileCtx.moveTo(size / 2, size * 1.5); tileCtx.lineTo(size * 1.5, size / 2)
		tileCtx.stroke()
		const pattern = tile.getContext('2d').createPattern(tile, 'repeat')
		stripedPatterns[baseColor] = pattern
		return pattern
	}

	// Returns the color for a bar: active color for the selected day, otherwise the inactive color, striped if the day had 4xx/5xx errors.
	function barBackground(index, activeColor, inactiveColor) {
		const color = index === {{ day }} ? activeColor : inactiveColor
		return errorDays[index] ? stripedPattern(color) : color
	}

	const canvas = document.getElementById('whistles-chart')
	const whistlesChart = new Chart(canvas, {
		type: 'bar',
		data: {
			labels: {{ chart_xaxis_labels }},
			datasets: [
				{
					label: 'Logged in',
					data: {{ authed_chart_data }},
					hoverBackgroundColor: authed_hover, 
					backgroundColor: (context) => barBackground(context.dataIndex, authed_active, authed_inactive),
				},
				{
					label: 'Unauthenticated',
					data: {{ unauthed_chart_data }},
					hoverBackgroundColor: unauthed_hover, 
					backgroundColor: (context) => barBackground(context.dataIndex, unauthed_active, unauthed_inactive),
				}
			]
		},
		options: {
			maintainAspectRatio: false,
			animation: { duration: 0 },
			elements: {
				bar: {
					borderRadius: 2,
				},
				point: {
					radius: 2,
				}
			},
			plugins: {
				legend: { 
					display: true,
					position: 'bottom',
					labels: {
						usePointStyle: true,
						pointStyle: 'rectRounded',
						boxHeight: 10,
						boxWidth: 8,
					}
				},
				tooltip: { enabled: false },
			},
			responsive: true,
			scales: {
				x: { 
					grid: { display: false },
					stacked: true,
					//ticks: { autoSkip: false },
				},
				y: { grid: { display: false },
					ticks: { precision: 0 },
					stacked: true,
					suggestedMax: 10,
				}
			},
			onHover: (event, chartElement) => {
				event.native.target.style.cursor = chartElement[0] ? 'pointer' : 'default'
			},
		},
	})
	const chartDates = {{ chart_dates|safe }}
	canvas.onclick = (evt) => {
		const res = whistlesChart.getElementsAtEventForMode(
			evt,
			'nearest',
			{ intersect: true },
			true
		)
		// If didn't click on a bar, `res` will be an empty array
		if (res.length === 0) {
			return
		}

		/* -1 is used because we're using chart bar number (which starts at 1) to lookup the date in an array (which starts at 0) */
		window.location = "{% url 'silent_mammoth_whistle:index_by_date' date %}".slice(0,-10) + chartDates[whistlesChart.data.labels[res[0].index]-1]
		
	}
</script>
